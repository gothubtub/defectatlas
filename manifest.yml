# Defect Atlas — Jira Forge app manifest
#
# Custom UI (not UI Kit): the canvas needs free-form pointer drawing,
# SVG regions and pixel-exact positioning that UI Kit's native component
# set doesn't give us, so the frontend is a plain React app served from
# `static/app/dist` and talks to the backend through @forge/bridge's
# invoke(), which calls the resolver functions defined below.

modules:
  jira:globalPage:
    - key: defect-atlas-global-page
      resource: main
      resolver:
        function: resolver
      title: Defect Atlas
      icon: resource:icon

  jiraCustomFieldType:
    - key: component-aspect-field
      name: Component-Aspect
      description: >-
        The Defect Atlas region a bug is associated with. Create one
        instance of this field type from Jira admin ▸ Issue fields, then
        add it to the Bug issue screen — Forge apps can offer a field
        type but cannot silently attach a field to existing screens.
      type: string
      readAccess:
        - "*"
      collection: false

  function:
    - key: resolver
      handler: index.handler

resources:
  - key: main
    path: static/app/dist
  - key: icon
    path: static/app/public/icon.svg

app:
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
  runtime:
    name: nodejs22.x

permissions:
  scopes:
    # Read/search issues, components, versions, projects for the mock-jira
    # layer's real code path (src/resolvers/jira/realClient.js) and for the
    # eventual live sync.
    - read:jira-work
    # Push status/severity changes back to Jira (two-way sync, UC-02) and
    # write project/issue entity properties (artifact + region storage).
    - write:jira-work
    # Create the Component-Aspect custom field type instance and read
    # project permission schemes for the Editor/Viewer role derivation.
    - manage:jira-configuration
    # Editor/Viewer membership list (BRD §5 Workspace.members[]) — the one
    # piece of state that intentionally lives in Forge storage rather than
    # as a Jira entity, since it has no natural Jira home.
    - storage:app
  content:
    styles:
      - unsafe-inline
  external:
    images:
      - "*.atlassian.net"
